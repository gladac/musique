<!doctype html>
<html lang="fr">
<head>

<title>Mon Lecteur Musique</title>
<style>
:root{--bg:#ffffff;--bg2:#f2f2f7;--fg:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--accent:#fa243c;--sheet:#f9f9fb;--onaccent:#ffffff;--shadow:rgba(0,0,0,.18);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--bg2:#1c1c1e;--fg:#ffffff;--mute:#98989f;--line:#2c2c2e;--accent:#ff375f;--sheet:#1c1c1e;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;display:flex;flex-direction:column;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i.f{fill:currentColor;stroke:currentColor;stroke-width:1.6}
main{flex:1;overflow-y:auto;min-height:0;padding-bottom:12px}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);color:var(--accent);font-weight:600;border-radius:10px;padding:11px 18px;min-height:44px}
.pill.solid{background:var(--accent);color:var(--onaccent)}
.pill svg.i{width:18px;height:18px}
.actions{display:flex;gap:10px;margin:6px 0 14px}
.actions .pill{flex:1;justify-content:center}
.search{width:100%;background:var(--bg2);border:0;border-radius:10px;padding:12px 14px;font:inherit;color:var(--fg);margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .t{color:var(--accent)}
.row .btn{width:40px;height:44px;display:grid;place-items:center;color:var(--mute);flex:none}
.row .btn.fav{color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--bg2);color:var(--mute)}
.badge.yt{color:var(--accent)}
.art{width:48px;height:48px;border-radius:6px;flex:none;display:grid;place-items:center;color:rgba(255,255,255,.92);font-weight:700;font-size:20px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.lg{width:100%;height:auto;aspect-ratio:1;border-radius:12px;font-size:96px;box-shadow:0 20px 40px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{text-align:left;min-width:0}
.card .art{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:44px;margin-bottom:6px}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{color:var(--mute);font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 12px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty b{color:var(--fg);font-size:20px}
.back{color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center;gap:2px;margin-top:6px}
.mini{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:14px;padding:8px 10px;margin-bottom:6px;min-width:0}
.mini[hidden]{display:none}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mini .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .art{width:40px;height:40px;font-size:16px}
.mini .ctl{width:44px;height:44px;display:grid;place-items:center}
.tabs{display:flex;border-top:1px solid var(--line);padding-top:6px}
.tabs button{flex:1;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute)}
.tabs button.on{color:var(--accent)}
.np{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(24px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .3s ease;overflow-y:auto}
.np.show{transform:none}
.np .grab{align-self:center;width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.np .artw{width:min(100%,46vh,360px);align-self:center;margin-top:4px}
.ytbox{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.ytbox[hidden]{display:none}
.ytbox iframe{width:100%;height:100%;border:0;display:block}
.np .titles{display:flex;align-items:center;gap:12px;min-width:0}
.np .titles .m{flex:1;min-width:0}
.np .titles .t{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .titles .a{color:var(--accent);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.times{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums;margin-top:-6px}
.ctrls{display:flex;justify-content:space-between;align-items:center;max-width:380px;width:100%;align-self:center}
.ctrls button{width:52px;height:52px;display:grid;place-items:center;border-radius:50%}
.ctrls .big svg.i{width:44px;height:44px}
.ctrls .tog{color:var(--mute)}
.ctrls .tog.on{color:var(--accent);background:var(--bg2)}
.np .more{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--sheet);width:min(100%,520px);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px);max-height:88%;overflow-y:auto}
.sheet h2{font-size:17px;margin:0 0 10px;text-wrap:balance}
.sheet .it{display:flex;align-items:center;width:100%;text-align:left;min-height:48px;border-top:1px solid var(--line);gap:12px}
.sheet .it.danger{color:#ff3b30}
.sheet input[type=text],.sheet input[type=password]{width:100%;background:var(--bg2);border:0;border-radius:10px;padding:12px 14px;font:inherit;color:var(--fg);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--bg2);border-radius:999px;padding:8px 14px;min-height:36px}
.chip.on{background:var(--accent);color:var(--onaccent)}
.band{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.band span:last-child{color:var(--mute);text-align:right}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:90%;text-align:center}
.toast[hidden]{display:none}
.note{color:var(--mute);font-size:13px;margin-top:10px;line-height:1.4}
.err{color:#ff3b30;font-size:14px;padding:12px 0}
.np{--fg:#fff;--mute:rgba(255,255,255,.68);--bg2:rgba(255,255,255,.18);--accent:#fff;--onaccent:#111;--shadow:rgba(0,0,0,.45);background:#111;color:#fff;isolation:isolate}
.npbgwrap{position:absolute;inset:0;overflow:hidden;z-index:-2;pointer-events:none}
.npbg{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.7);opacity:.95}
.np::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.5));pointer-events:none}
.np .titles .t{font-size:24px}
.np .titles .a{color:var(--mute)}
.mini{position:relative;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.mprog{position:absolute;left:12px;right:12px;bottom:0;height:2px}
.mprog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
h2.sec{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:22px 0 10px}
.qp{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:92%;column-gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.qp::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.qp>.row{scroll-snap-align:start}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hc{flex:none;width:140px;text-align:left;min-width:0}
.hc .art{width:140px;height:140px;border-radius:10px;margin-bottom:6px;font-size:40px}
.hc .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .a{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art[hidden]{display:none}
.seg{display:flex;align-self:center;background:var(--bg2);border-radius:999px;padding:3px}
.seg[hidden]{display:none}
.seg button{padding:7px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute);min-height:34px}
.seg button.on{background:#fff;color:#111}
.sg{display:flex;align-items:center;gap:6px;min-width:0}
.sgm{flex:1;min-width:0;display:flex;align-items:center;gap:16px;min-height:56px;text-align:left}
.sgm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgm svg.i{flex:none}
.sg img{width:56px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.sgf{width:44px;height:44px;display:grid;place-items:center;color:var(--mute);flex:none}
.sgclear{color:var(--accent);font-weight:600;min-height:44px;display:block}
#sugg[hidden],#sres[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.np{transition:none}}

:root[data-theme=light]{--bg:#fff;--bg2:#f2f2f7;--fg:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--sheet:#f9f9fb;--shadow:rgba(0,0,0,.18);color-scheme:light}
:root[data-theme=dark]{--bg:#000;--bg2:#1c1c1e;--fg:#fff;--mute:#98989f;--line:#2c2c2e;--sheet:#1c1c1e;--shadow:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme=sand]{--bg:#f6efe0;--bg2:#ebe1ca;--fg:#3a2f1f;--mute:#8a7a5f;--line:#ddd0b5;--sheet:#f1e8d3;--shadow:rgba(60,40,10,.2);color-scheme:light}
:root[data-theme=ocean]{--bg:#071a28;--bg2:#10303f;--fg:#e8f4ff;--mute:#86a3b8;--line:#1a3d50;--sheet:#0d2736;--shadow:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme=forest]{--bg:#0b1a12;--bg2:#14291d;--fg:#eaf5ec;--mute:#8aa593;--line:#1f3a2a;--sheet:#102418;--shadow:rgba(0,0,0,.6);color-scheme:dark}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--sheet);flex:none}
.swatch.on{border-color:var(--fg)}
.sw{position:relative;display:flex;align-items:center;background:var(--bg2);border-radius:10px;margin-bottom:8px;min-height:44px}
.sw>svg.i{position:absolute;left:12px;width:18px;height:18px;color:var(--mute);pointer-events:none}
.sw input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:16px;color:var(--fg);padding:12px 42px 12px 38px;border-radius:10px;-webkit-appearance:none;appearance:none}
.sw input:focus-visible{outline:0}
.sw input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sw:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.sw .x{position:absolute;right:2px;width:40px;height:44px;display:grid;place-items:center;color:var(--mute)}
.sw .x svg.i{width:20px;height:20px}
.np>*{flex:none;order:5}
.np .grab{order:0;width:100%;height:28px;display:grid;place-items:center}
.np .grab i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}
.np .seg{order:1}
.np .artw{order:2}
.np .ytbox{order:9;align-self:center;max-width:560px;width:100%}
.np.vm .ytbox{order:2}
.np.vm .artw{display:none}
.np .titles .a{display:block;max-width:100%;text-align:left;background:none;font-size:18px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);flex:none}
#b-fav.on{color:#ff375f}
.adchip{align-self:center;background:#ffcc00;color:#111;font-weight:700;border-radius:999px;padding:6px 14px;font-size:13px}
.adtag{color:#ffcc00;font-weight:700}
.crumb{color:var(--mute);font-size:13px}
</style>

function openDB(){return new Promise(function(res){try{var r=indexedDB.open('lecteur-musique',1);r.onupgradeneeded=function(){r.result.createObjectStore('blobs');r.result.createObjectStore('meta')};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function idb(store,mode,fn){return new Promise(function(res){if(!db)return res(null);try{var t=db.transaction(store,mode),o=fn(t.objectStore(store));t.oncomplete=function(){res(o&&o.result)};t.onerror=function(){res(null)};t.onabort=function(){res(null)}}catch(e){res(null)}})}
function saveMeta(){return idb('meta','readwrite',function(s){return s.put(S,'state')})}
function getBlob(id){if(blobs.has(id))return Promise.resolve(blobs.get(id));return idb('blobs','readonly',function(s){return s.get(id)})}

function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360}
function artStyle(seed){var h=hue(seed);return 'background:linear-gradient(135deg,hsl('+h+' 72% 62%),hsl('+((h+45)%360)+' 70% 42%))'}

/* ---------- metadata and duplicates ---------- */
function parseMeta(raw,channel){
 var t=raw.replace(/\s*[\(\[][^\)\]]*(official|officiel|lyrics?|paroles|audio|video|vid[eé]o|clip|hd|4k|visuali[sz]er)[^\)\]]*[\)\]]/ig,'').trim();
 var artist=(channel||'').replace(/\s*-\s*topic$/i,'').replace(/vevo$/i,'').trim()||'Artiste inconnu';
 var m=t.match(/^(.+?)\s+[-–—]\s+(.+)$/);
 if(m){artist=m[1].trim();t=m[2].trim()}
 return {title:t||raw,artist:artist};
}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\(\[][^\)\]]*[\)\]]/g,'').replace(/[^a-z0-9]/g,'')}
function sameTrack(a,b){
 if(norm(a.title)!==norm(b.title)||!norm(a.title))return false;
 var x=norm(a.artist),y=norm(b.artist),u='artisteinconnu';
 return x===y||x===u||y===u||x.indexOf(y)>-1||y.indexOf(x)>-1;
}
function dedupe(newT){
 var dups=S.tracks.filter(function(x){return x!==newT&&sameTrack(x,newT)&&x.added<=newT.added});
 dups.forEach(function(old){
  S.playlists.forEach(function(p){var i=p.ids.indexOf(old.id);if(i>-1){if(p.ids.indexOf(newT.id)>-1)p.ids.splice(i,1);else p.ids[i]=newT.id}});
  removeTrack(old.id,true);
  toast('Doublon retiré : « '+old.title+' »');
 });
}
function dedupeAll(){
 var list=S.tracks.slice().sort(function(a,b){return b.added-a.added});
 list.forEach(function(t){if(saved(t.id))dedupe(t)});
}

 return ids;
}

/* ---------- playback engine (local audio + YouTube) ---------- */
var Y={p:null,loading:null,state:-1,timer:null};
function loadYT(){
 if(window.YT&&YT.Player)return Promise.resolve();
 if(Y.loading)return Y.loading;
 Y.loading=new Promise(function(res,rej){
  window.onYouTubeIframeAPIReady=res;
  var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=function(){Y.loading=null;rej(new Error('yt'))};document.head.appendChild(s);
 });
 return Y.loading;
}
function ytError(){
 toast('Cette vidéo ne peut pas être lue ici');
 Y.errs=(Y.errs||0)+1;
 if(Y.errs<4&&R.queue.length>1)setTimeout(function(){next(false)},900);
}
function ytState(e){
 Y.state=e.data;if(e.data===1)Y.errs=0;
 if(e.data===0)next(true);
 refreshState();
}
function playYT(t){
 $('#ytbox').hidden=false;
 return loadYT().then(function(){
  if(!Y.p){
   Y.p=new YT.Player('ytplayer',{width:'100%',height:'100%',videoId:t.vid,playerVars:{playsinline:1,rel:0,autoplay:1},events:{onReady:function(e){try{e.target.playVideo()}catch(x){}},onStateChange:ytState,onError:ytError}});
   Y.timer=setInterval(tick,500);
  }else{Y.p.loadVideoById(t.vid)}
 }).catch(function(){toast('Impossible de charger le lecteur YouTube')});
}
function ytReadyP(){return Y.p&&typeof Y.p.getPlayerState==='function'}
function curTime(){var t=curT();if(t&&t.src==='yt'){return ytReadyP()?Y.p.getCurrentTime():0}return A.currentTime}
function curDur(){var t=curT();if(t&&t.src==='yt'){return ytReadyP()?Y.p.getDuration():0}return A.duration||0}
function adCheck(){
 var t=curT(),ad=R.ad;
 if(!t||t.src!=='yt'||!ytReadyP()){ad=false}
 else if(Y.state===1||Y.state===2){try{var vd=Y.p.getVideoData();ad=!!(vd&&vd.video_id&&vd.video_id!==t.vid)}catch(e){}}
 else if(Y.state===0||Y.state===-1)ad=false;
 if(ad!==R.ad){R.ad=ad;renderMini();renderNP();
  if(ad){$('#np').classList.add('show');setTimeout(function(){var b=$('#ytbox');if(b&&!$('#np').classList.contains('vm'))b.scrollIntoView({behavior:'smooth',block:'center'})},200)}}
}
function tick(){
 var d=curDur(),c=curTime();
 if(!R.seeking&&d)$('#seek').value=Math.round(c/d*1000);
 $('#tcur').textContent=fmt(c);$('#tdur').textContent=fmt(d);
 adCheck();
 var mp=$('#mprogi');if(mp)mp.style.width=(d?Math.min(100,c/d*100):0)+'%';
}
var ctx=null,filters=[],bass=null,graphOK=false;
function applyEQ(){if(!graphOK)return;for(var i=0;i<5;i++)filters[i].gain.value=S.eq.bands[i];bass.gain.value=S.eq.bass}
function initGraph(){
 if(ctx){if(ctx.state==='suspended')ctx.resume();return}
 try{
  var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  var src=ctx.createMediaElementSource(A);
  bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=110;
  var prev;src.connect(bass);prev=bass;
  FREQ.forEach(function(f){var b=ctx.createBiquadFilter();b.type='peaking';b.frequency.value=f;b.Q.value=1;prev.connect(b);prev=b;filters.push(b)});
  prev.connect(ctx.destination);graphOK=true;applyEQ();if(ctx.state==='suspended')ctx.resume();
 }catch(e){graphOK=false}
}
function setQueue(ids,start,shuffle){
 R.orig=ids.slice();
 if(shuffle){var rest=ids.filter(function(x,i){return i!==start});
  for(var i=rest.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rest[i];rest[i]=rest[j];rest[j]=t}
  R.queue=[ids[start]].concat(rest)}
 else R.queue=ids.slice();
 playAt(shuffle?0:start);
}
function playAt(i){
 var id=R.queue[i],t=track(id);if(!t)return;
 R.qi=i;
 if(t.src==='yt'){
  A.pause();Y.state=-1;R.ad=false;
  playYT(t);render();setSession(t);return;
 }
 if(Y.p&&ytReadyP()){try{Y.p.pauseVideo()}catch(e){}}
 $('#ytbox').hidden=true;
 getBlob(id).then(function(b){
  if(!b){toast('Fichier introuvable');return}
  if(R.url)URL.revokeObjectURL(R.url);
  R.url=URL.createObjectURL(b);A.src=R.url;initGraph();
  var p=A.play();if(p&&p.catch)p.catch(function(){});
  setSession(t);render();
 });
}
function next(auto){
 if(!R.queue.length)return;
 var t=curT();
 if(auto&&S.repeat===2){if(t&&t.src==='yt'){Y.p.seekTo(0,true);Y.p.playVideo()}else{A.currentTime=0;A.play()}return}
 var i=R.qi+1;
 if(i>=R.queue.length){if(S.repeat===1||!auto)i=0;else{render();return}}
 playAt(i);
}
function prev(){
 if(!R.queue.length)return;
 if(curTime()>3){seekTo(0);return}
 playAt(R.qi>0?R.qi-1:R.queue.length-1);
}
function seekTo(sec){var t=curT();if(t&&t.src==='yt'){if(ytReadyP())Y.p.seekTo(sec,true)}else A.currentTime=sec}
function toggle(){
 var t=curT();if(!t)return;
 if(t.src==='yt'){if(!ytReadyP())return;if(Y.p.getPlayerState()===1)Y.p.pauseVideo();else Y.p.playVideo();return}
 if(A.paused){initGraph();var p=A.play();if(p&&p.catch)p.catch(function(){})}else A.pause();
}
function reshuffle(){
 var cur=R.queue[R.qi];if(!cur)return;
 if(S.shuffle){var rest=R.orig.filter(function(x){return x!==cur});
  for(var i=rest.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rest[i];rest[i]=rest[j];rest[j]=t}
  R.queue=[cur].concat(rest);R.qi=0}
 else{R.queue=R.orig.slice();R.qi=Math.max(0,R.queue.indexOf(cur))}
}
function setSession(t){
 if(!('mediaSession' in navigator)||t.src==='yt')return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
 navigator.mediaSession.setActionHandler('play',toggle);navigator.mediaSession.setActionHandler('pause',toggle);
 navigator.mediaSession.setActionHandler('nexttrack',function(){next(false)});navigator.mediaSession.setActionHandler('previoustrack',prev);
 navigator.mediaSession.setActionHandler('seekto',function(e){if(e.seekTime!=null)A.currentTime=e.seekTime})}catch(e){}
}
A.addEventListener('ended',function(){next(true)});
A.addEventListener('timeupdate',tick);
A.addEventListener('play',refreshState);
A.addEventListener('pause',refreshState);
A.addEventListener('loadedmetadata',function(){
 var t=curT();
 if(t&&t.src==='local'&&isFinite(A.duration)&&Math.abs((t.dur||0)-A.duration)>1){t.dur=Math.round(A.duration);saveMeta();renderMain()}
 tick();
});

/* ---------- search ---------- */
function doSearch(){
 var inp=$('#sq');var q=((inp&&inp.value)||R.sq||'').trim();if(!q)return;
 R.sq=q;R.lastq=q;R.searched=true;var key=getKey();if(!key){settingsSheet();return}
 R.loading=true;R.err='';renderMain();
 var url='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=20&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(key);
 fetch(url).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(o){
  R.loading=false;
  if(!o.ok){
   var reason=o.j&&o.j.error&&o.j.error.errors&&o.j.error.errors[0]&&o.j.error.errors[0].reason;
   R.err=reason==='quotaExceeded'?'Limite de recherches du jour atteinte. Réessaie demain.':(reason==='keyInvalid'||reason==='badRequest')?'Clé API refusée. Vérifie-la dans les réglages.':'Recherche impossible'+(o.j&&o.j.error?' : '+o.j.error.message:'.');
   R.results=[];renderMain();return;
  }
  R.results=(o.j.items||[]).filter(function(it){return it.id&&it.id.videoId}).map(function(it){
   var sn=it.snippet,m=parseMeta(decode(sn.title),decode(sn.channelTitle));
   var id='y_'+it.id.videoId;
   var t={id:id,src:'yt',vid:it.id.videoId,title:m.title,artist:m.artist,thumb:'https://i.ytimg.com/vi/'+it.id.videoId+'/mqdefault.jpg',dur:0,added:0};
   R.temp[id]=t;return t;
  });
  if(!R.results.length)R.err='Aucun résultat.';
  renderMain();
 }).catch(function(){R.loading=false;R.err='Pas de connexion à YouTube.';R.results=[];renderMain()});
}
function saveTrack(t){
 if(saved(t.id))return track(t.id);
 var c=Object.assign({},t,{added:Date.now()});delete R.temp[t.id];R.temp[t.id]=c;
 S.tracks.push(c);dedupe(c);saveMeta();return c;
}

/* ---------- home ---------- */

function apiErr(o){
 var reason=o&&o.j&&o.j.error&&o.j.error.errors&&o.j.error.errors[0]&&o.j.error.errors[0].reason;
 if(reason==='quotaExceeded')return 'Limite de requêtes du jour atteinte. Réessaie demain.';
 if(reason==='keyInvalid'||reason==='badRequest')return 'Clé API refusée. Vérifie-la dans les réglages.';
 return 'Chargement impossible'+(o&&o.j&&o.j.error?' : '+o.j.error.message:'.');
}

function fetchTrending(key){
 return apiGet('https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&videoCategoryId=10&regionCode=FR&maxResults=24&key='+encodeURIComponent(key)).then(function(j){

 });

  return (j.items||[]).filter(function(it){return it.id&&it.id.videoId}).map(function(it){var m=parseMeta(decode(it.snippet.title),decode(it.snippet.channelTitle));return {vid:it.id.videoId,title:m.title,artist:m.artist}});
 });

function pickArtists(){
 var cnt={};
 S.tracks.forEach(function(t){var a=(t.artist||'').trim();if(!a||norm(a)==='artisteinconnu')return;cnt[a]=(cnt[a]||0)+1});
 var pool=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]||(a<b?-1:1)});
 if(!pool.length)return [];
 var day=Math.floor(Date.now()/864e5),out=[];
 for(var i=0;i<Math.min(3,pool.length);i++)out.push(pool[(day+i)%pool.length]);
 return out;
}

function ensureHome(force){
 if(R.hload)return;
 if(!getKey()){if(R.view==='home')renderMain();return}

function loadHome(force){
 var key=getKey();R.hload=true;R.herr='';
 if(R.view==='home')renderMain();
 var c=cacheGet(),today=todayKey(),now=Date.now(),names=pickArtists(),jobs=[];
 var needTrend=force||!c.trend||!c.trend.length||!c.trendAt||now-c.trendAt>6*3600*1000;
 var needArt=force||c.day!==today||!c.artists||(!c.artists.length&&names.length>0);
 if(needTrend)jobs.push(fetchTrending(key).then(function(list){c.trend=list;c.trendAt=now}));
 if(needArt){
  c.artists=[];c.day=today;
  names.forEach(function(n){jobs.push(fetchArtist(key,n).then(function(list){if(list.length)c.artists.push({name:n,items:list})}).catch(function(){}))});
 }
 Promise.all(jobs).then(function(){cacheSet(c);buildHome(c)})
 .catch(function(o){R.herr=o&&o.j?apiErr(o):'Pas de connexion à YouTube.';if(c.trend&&c.trend.length)buildHome(c)})
 .then(function(){R.hload=false;R.hat=Date.now();if(R.view==='home')renderMain()});

 });

function fetchMix(t){

 if(c&&c.day===todayKey()&&c.items)return Promise.resolve(c.items);
 var seed=t.src==='yt'?apiGet('https://www.googleapis.com/youtube/v3/videos?part=snippet,topicDetails&id='+encodeURIComponent(t.vid)+'&key='+encodeURIComponent(key)):Promise.resolve(null);

  return searchVids(key,q,25);
 }).then(function(list){

}
function nameSheet(id){
 sheet('<h2>Nouvelle playlist</h2><input type="text" id="plname" placeholder="Nom de la playlist" maxlength="40" autocomplete="off"><button class="pill solid" style="width:100%;justify-content:center" data-act="plcreate" data-id="'+(id||'')+'">Créer</button>');
 setTimeout(function(){var i=$('#plname');if(i)i.focus()},50);
}
function eqSheet(){
 var h='<h2>Égaliseur</h2><div class="chips">'+Object.keys(PRESETS).map(function(k){return '<button class="chip'+(S.eq.preset===k?' on':'')+'" data-act="preset" data-k="'+k+'">'+k+'</button>'}).join('')+'</div>';
 h+='<div class="band"><span>Basses</span><input type="range" min="0" max="12" step="1" value="'+S.eq.bass+'" data-eq="bass" aria-label="Renfort des basses"><span id="v-bass">+'+S.eq.bass+'</span></div>';
 for(var i=0;i<5;i++)h+='<div class="band"><span>'+FL[i]+'</span><input type="range" min="-12" max="12" step="1" value="'+S.eq.bands[i]+'" data-eq="'+i+'" aria-label="'+FL[i]+'"><span id="v-'+i+'">'+(S.eq.bands[i]>0?'+':'')+S.eq.bands[i]+'</span></div>';
 h+='<div class="note">L\'égaliseur s\'applique à tes fichiers audio, pas à la lecture YouTube.</div>';
 sheet(h);
}

/* ---------- actions ---------- */
function addFiles(files){
 var n=0,chain=Promise.resolve();
 Array.prototype.slice.call(files).forEach(function(f){chain=chain.then(function(){
  if(!(/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name)))return;
  var id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),base=f.name.replace(/\.[^.]+$/,''),artist='Artiste inconnu',title=base,m=base.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if(m){artist=m[1].trim();title=m[2].trim()}
  var t={id:id,src:'local',title:title,artist:artist,dur:0,added:Date.now()};
  blobs.set(id,f);S.tracks.push(t);n++;
  return idb('blobs','readwrite',function(s){return s.put(f,id)}).then(function(){dedupe(t)});
 })});
 chain.then(function(){saveMeta();render();toast(n?n+' fichier'+(n>1?'s ajoutés':' ajouté'):'Aucun fichier audio reconnu')});
}
function removeTrack(id,quiet){
 var cur=R.queue[R.qi],old=track(id),yt=old&&old.src==='yt',wasCur=cur===id&&!yt;
 if(yt)R.temp[id]=Object.assign({},old);
 S.tracks=S.tracks.filter(function(t){return t.id!==id});
 S.playlists.forEach(function(p){p.ids=p.ids.filter(function(x){return x!==id})});
 blobs.delete(id);idb('blobs','readwrite',function(s){return s.delete(id)});
 if(!yt){R.queue=R.queue.filter(function(x){return x!==id});R.orig=R.orig.filter(function(x){return x!==id})}
 if(wasCur){A.pause();A.removeAttribute('src');if(Y.p&&ytReadyP()){try{Y.p.pauseVideo()}catch(e){}}R.qi=-1;$('#np').classList.remove('show')}
 else R.qi=R.queue.indexOf(cur);
 if(!quiet)saveMeta();
}
document.addEventListener('click',function(e){
 if(e.target.id==='scrim'){closeSheet();return}
 if(!e.target.closest('#sugg')&&e.target.id!=='sq')hideSugg();
 var el=e.target.closest('[data-act]');if(!el)return;
 var a=el.dataset.act,id=el.dataset.id;
 if(!id&&(a==='addpl'||a==='savecur'))id=R.queue[R.qi];
 if(a==='tab'){R.view=el.dataset.v;R.tabof=R.view;R.q='';R.pl=null;R.nav=[];if(R.view==='home'){R.sq='';R.searched=false;R.results=[];R.err=''}render();$('#main').scrollTop=0;if(R.view==='home')ensureHome()}
 else if(a==='back'){R.view=R.nav.pop()||R.tabof||'home';render()}
 else if(a==='clr'){if(el.dataset['for']==='sq'){R.sq='';R.searched=false;R.results=[];R.err='';renderMain();var i1=$('#sq');if(i1){i1.focus();onSqInput()}}else{R.q='';renderMain();var i2=$('#q');if(i2)i2.focus()}}
 else if(a==='favcur'){var ct=curT();if(ct){if(saved(ct.id)){removeTrack(ct.id);toast('Retiré de Titres')}else{saveTrack(ct);toast('Ajouté à Titres')}render()}}
 else if(a==='npmore'){npMoreSheet()}
 else if(a==='mix'){mixSheet()}
 else if(a==='mixplay'){setQueue(R.mix.map(function(x){return x.id}),+el.dataset.i,false);closeSheet()}
 else if(a==='artist'){var cu=curT();if(cu){closeSheet();$('#np').classList.remove('show');openArtist(mainArtist(cu.artist))}}
 else if(a==='artistof'){var at=track(id);closeSheet();if(at)openArtist(mainArtist(at.artist))}
 else if(a==='albumcur'){closeSheet();albumOfCur()}
 else if(a==='openalb'){var al=(R.sx.albs||[])[+el.dataset.i];if(al)openAlbum(al)}
 else if(a==='theme'){lsSetRaw('theme',el.dataset.v);applyTheme();document.querySelectorAll('[data-act=theme]').forEach(function(b){b.classList.toggle('on',b===el)})}
 else if(a==='accent'){lsSetRaw('accent',el.dataset.v);applyTheme();document.querySelectorAll('[data-act=accent]').forEach(function(b){b.classList.toggle('on',b===el)})}
 else if(a==='playsec'){var arr=R.sec[el.dataset.sec]||R.sx[el.dataset.sec]||[];setQueue(arr.map(function(x){return x.id}),+el.dataset.i,S.shuffle);openNP()}
 else if(a==='homeref'){ensureHome(true)}
 else if(a==='mode'){S.npMode=el.dataset.m;saveMeta();renderNP()}
 else if(a==='sgrun'){R.sq=el.dataset.q;var s1=$('#sq');if(s1)s1.value=R.sq;hideSugg();doSearch()}
 else if(a==='sgfill'){R.sq=el.dataset.q;var s2=$('#sq');if(s2){s2.value=R.sq;s2.focus()}onSqInput()}
 else if(a==='sgclear'){histSet([]);renderSugg()}
 else if(a==='add'){$('#files').click()}
 else if(a==='play'){if(R.view==='home'&&R.searched){var t0=track(viewIds()[+el.dataset.i]);if(t0)histAdd(R.lastq,t0.thumb)}setQueue(viewIds(),+el.dataset.i,S.shuffle);openNP()}
 else if(a==='playall'){setQueue(viewIds(),0,false)}
 else if(a==='shuf'){var ids3=viewIds();if(ids3.length){S.shuffle=true;saveMeta();setQueue(ids3,Math.floor(Math.random()*ids3.length),true)}}
 else if(a==='save'){if(R.view==='home'&&R.searched)histAdd(R.lastq,track(id).thumb);saveTrack(track(id));render();toast('Ajouté à Titres')}
 else if(a==='unsave'){removeTrack(id);render()}
 else if(a==='savecur'){saveTrack(track(id));render();toast('Ajouté à Titres')}
 else if(a==='more'){moreSheet(id)}
 else if(a==='delask'){var tt=track(id);sheet('<h2>Supprimer « '+esc(tt.title)+' » ?</h2><div class="note" style="margin:0 0 12px">'+(tt.src==='local'?'Le fichier sera retiré de cette appli. Ton original reste dans tes fichiers.':'Le titre sera retiré de Titres.')+'</div><button class="it danger" data-act="delok" data-id="'+id+'">Supprimer</button><button class="it" data-act="close">Annuler</button>')}
 else if(a==='delok'){removeTrack(id);closeSheet();render()}
 else if(a==='close'){closeSheet()}
 else if(a==='settings'){settingsSheet()}
 else if(a==='keysave'){setKey(($('#apikey').value||'').trim());closeSheet();render();toast('Clé enregistrée')}
 else if(a==='addpl'){if(!id)return;plPicker(id)}
 else if(a==='pladd'){var tr=track(id);if(!saved(id))tr=saveTrack(tr);var pid=tr.id;var p=S.playlists.find(function(x){return x.id===el.dataset.pl});if(p.ids.indexOf(pid)<0)p.ids.push(pid);saveMeta();closeSheet();toast('Ajouté à « '+p.name+' »');render()}
 else if(a==='plnew'){nameSheet(id)}
 else if(a==='plcreate'){var nm=($('#plname').value||'').trim();if(!nm){toast('Donne un nom à la playlist');return}
  var tid=id;if(tid&&!saved(tid)){tid=saveTrack(track(tid)).id}
  S.playlists.push({id:'p'+Date.now().toString(36),name:nm,ids:tid?[tid]:[]});saveMeta();closeSheet();toast('Playlist « '+nm+' » créée');render()}
 else if(a==='openpl'){R.view='playlist';R.pl=id;R.q='';render()}
 else if(a==='pldel'){var pp=S.playlists.find(function(x){return x.id===id});sheet('<h2>Supprimer la playlist « '+esc(pp.name)+' » ?</h2><div class="note" style="margin:0 0 12px">Les titres restent dans Titres.</div><button class="it danger" data-act="pldelok" data-id="'+id+'">Supprimer</button><button class="it" data-act="close">Annuler</button>')}
 else if(a==='pldelok'){S.playlists=S.playlists.filter(function(x){return x.id!==id});R.view='playlists';R.pl=null;saveMeta();closeSheet();render()}
 else if(a==='plrm'){var pl=S.playlists.find(function(x){return x.id===R.pl});if(pl){pl.ids=pl.ids.filter(function(x){return x!==id});saveMeta()}closeSheet();render()}
 else if(a==='np'){renderNP();$('#np').classList.add('show')}
 else if(a==='npclose'){$('#np').classList.remove('show')}
 else if(a==='toggle'){toggle()}
 else if(a==='next'){next(false)}
 else if(a==='prev'){prev()}
 else if(a==='shuf2'){S.shuffle=!S.shuffle;reshuffle();saveMeta();renderNP()}
 else if(a==='rep'){S.repeat=(S.repeat+1)%3;saveMeta();renderNP()}
 else if(a==='eq'){initGraph();eqSheet()}
 else if(a==='preset'){var k=el.dataset.k;S.eq.bands=PRESETS[k][0].slice();S.eq.bass=PRESETS[k][1];S.eq.preset=k;applyEQ();saveMeta();eqSheet()}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){R.q=t.value;var pos=t.selectionStart;renderMain();var q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}
 else if(t.id==='sq'){R.sq=t.value;if(!t.value){R.searched=false;R.results=[];R.err='';var sr=$('#sres');if(sr)sr.innerHTML=getKey()?homeContent():''}var xb=t.parentNode.querySelector('.x');if(xb)xb.hidden=!t.value;onSqInput()}
 else if(t.id==='seek'){R.seeking=true;var d=curDur();if(d)seekTo(t.value/1000*d);tick()}
 else if(t.dataset&&t.dataset.eq!==undefined){
  var k=t.dataset.eq,v=+t.value;
  if(k==='bass'){S.eq.bass=v;$('#v-bass').textContent='+'+v}
  else{S.eq.bands[+k]=v;$('#v-'+k).textContent=(v>0?'+':'')+v}
  S.eq.preset='';applyEQ();
 }
});
document.addEventListener('change',function(e){
 if(e.target.id==='seek')R.seeking=false;
 if(e.target.dataset&&e.target.dataset.eq!==undefined)saveMeta();
 if(e.target.id==='files'){addFiles(e.target.files);e.target.value=''}
});
document.addEventListener('pointerup',function(){R.seeking=false});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;
 if(e.target.id==='plname'){var b=document.querySelector('[data-act="plcreate"]');if(b)b.click()}
 else if(e.target.id==='sq'){e.preventDefault();e.target.blur();doSearch()}
 else if(e.target.id==='apikey'){var k=document.querySelector('[data-act="keysave"]');if(k)k.click()}
});

applyTheme();initNP();initSwipe();initSuggest();
openDB().then(function(d){db=d;return idb('meta','readonly',function(s){return s.get('state')})}).then(function(m){
 if(m){S.tracks=m.tracks||[];S.playlists=m.playlists||[];S.eq=m.eq||S.eq;S.shuffle=!!m.shuffle;S.repeat=m.repeat||0;S.npMode=m.npMode||'cover'}
 S.tracks.forEach(function(t){if(!t.src)t.src='local'});
 dedupeAll();render();ensureHome();
});
render();
})();
</script>
</body>
